- comp_req
- aou_req
architecture_directives:
- comp_arc_sta
- comp_arc_dyn
mitigation_issue_pattern: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
rules:
- id: gd_req__saf_attr_sufficient
  check: sufficient_requires_mitigation
  source: safety_analysis_process_reqs
- id: gd_req__saf_attr_mitigated_by
  check: valid_requires_mitigation
  source: safety_analysis_process_reqs
- id: gd_req__saf_attr_mitigation_issue
  check: open_mitigation_requires_issue
  source: safety_analysis_process_reqs
platform_allocation:
  status: fabric_policy_pending_owner_review
  accepted_directives:
  - plat_saf_dfa
  accepted_work_products:
  - wp__platform_dfa
internal_fault_prefixes:
- EX_
- UI_
checklist:
- id: Gen 1
  question: Are the safety analysis performed according to the defined process and templates? See :need:`gd_req__saf_structure`
    and also :need:`gd_temp__feat_saf_fmea` and :need:`gd_temp__feat_saf_dfa`
  source: safety_analysis_fdr_checklist
- id: Gen 2
  question: Are the safety analysis performed in a systematic way to identify the potential dependent
    failures / failure modes and their effects? Are the failure effect and the mitigation described?
  source: safety_analysis_fdr_checklist
- id: Gen 3
  question: Is the result of the safety analysis indicate if the safety requirements are complied?
  source: safety_analysis_fdr_checklist
- id: Gen 4
  question: Are the mitigations effective and implemented?
  source: safety_analysis_fdr_checklist
- id: Gen 5
  question: Are all AoU's that are used as mitigation's created and covered in the safety manual?
  source: safety_analysis_fdr_checklist
- id: Gen 6
  question: Are additional safety-related test cases determined by potential results of the safety analyses?
  source: safety_analysis_fdr_checklist
gates:
  design: safety_design_acceptance
  closure: safety_closure
loop:
  max_iterations: 3

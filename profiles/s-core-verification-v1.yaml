inspection_checklist:
- id: IMPL_01_01
  criterion: Is the design according to guidelines?
  source: implementation_inspection_checklist
- id: IMPL_01_02
  criterion: Is the implementation according to specification?
  source: implementation_inspection_checklist
- id: IMPL_01_03
  criterion: Are the design decisions and constraints documented?
  source: implementation_inspection_checklist
- id: IMPL_01_04
  criterion: Are all external libraries used by the component specified in the detailed design?
  source: implementation_inspection_checklist
- id: IMPL_02_01
  criterion: Are the static and dynamic code analysis reports verified for violations?
  source: implementation_inspection_checklist
- id: IMPL_02_02
  criterion: Do manual checks, that are derived from the coding guideline, find no safety critical error?
  source: implementation_inspection_checklist
- id: IMPL_03_01
  criterion: Do the UID of the interface in component documentation match the implemented interface names
    of the unit?
  source: implementation_inspection_checklist
- id: IMPL_03_02
  criterion: Are detailed design and source code consistent and is the respective traceability established
    ?
  source: implementation_inspection_checklist

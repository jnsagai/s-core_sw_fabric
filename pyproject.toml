[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "score-sw-fabric"
version = "0.0.0"
description = "Foundation for native S-CORE engineering workflows executed by Fabro"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cryptography==50.0.1",
    "PyYAML==6.0.3",
]

[project.scripts]
score-fabric = "score_sw_fabric.cli:main"

[dependency-groups]
dev = ["ruff==0.16.9", "mypy==2.3.1", "pytest==9.1.1", "types-PyYAML==6.0.12.20260906"]

[tool.hatch.build.targets.wheel]
packages = ["src/score_sw_fabric"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Frozen evidence and the verbatim owner brief retain their original bytes.
extend-exclude = [
    "docs/handoff/someip-84/factory/runs",
    "specs/011-change-impact-and-freshness/evidence/qualification/operator-scripts",
    "S_CORE_SW_FABRIC_TOKEN_OPTIMIZATION_SPEC_KIT_CODEX_BRIEF_v3_NO_JEV.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]

    \n\ndef verify_tree(root: Path, manifest: dict) -> None:\n    for entry in manifest[\"\
    files\"]:\n        path = root / entry[\"path\"]\n        data = os.readlink(path).encode()\
    \ if entry[\"mode\"] == \"120000\" else path.read_bytes()\n        blob = hashlib.sha1(b\"\
    blob \" + str(len(data)).encode() + b\"\\0\" + data).hexdigest()\n        if blob\
    \ != entry[\"sha\"] or len(data) != entry[\"size\"]:\n            raise ValueError(f\"\
    Source drift: {entry['path']}\")\n\n\ndef main() -> None:\n    phase, raw_inputs,\
    \ expected = sys.argv[1:]\n    if phase not in {\"baseline\", \"external-candidate\"\
    }:\n        raise ValueError(\"Unsupported measurement phase\")\n    inputs_path\
    \ = Path(raw_inputs)\n    if digest(inputs_path) != expected:\n        raise ValueError(\"\
    Measurement inputs changed\")\n    inputs = json.loads(inputs_path.read_bytes())\n\
    \    target = Path(inputs[\"target\"]).resolve(strict=True)\n    if not target.is_relative_to(Path(inputs[\"\
    disposable_root\"]).resolve(strict=True)):\n        raise ValueError(\"Target\
    \ is not disposable\")\n    for item in inputs[\"controls\"]:\n        if digest(Path(item[\"\
    path\"])) != item[\"sha256\"]:\n            raise ValueError(f\"Control drift:\
    \ {item['path']}\")\n    source = Path(inputs[\"baseline\"])\n    gtest = Path(inputs[\"\
    googletest\"])\n    source_manifest = json.loads(Path(inputs[\"source_manifest\"\
    ]).read_bytes())\n    gtest_manifest = json.loads(Path(inputs[\"googletest_manifest\"\
    ]).read_bytes())\n    verify_tree(source, source_manifest)\n    verify_tree(gtest,\
    \ gtest_manifest)\n    out = target / \".llm_tmp\" / phase\n    out.mkdir(parents=True,\
    \ exist_ok=False)\n    work = out / \"source\"\n    shutil.copytree(source, work,\
    \ symlinks=True)\n\n    def run(name: str, command: list[str], expected_exit:\
    \ int) -> None:\n        with (out / f\"{name}.stdout\").open(\"wb\") as stdout:\n\
    \            with (out / f\"{name}.stderr\").open(\"wb\") as stderr:\n       \
    \         result = subprocess.run(\n                    command, cwd=work, stdout=stdout,\
    \ stderr=stderr, timeout=180, check=False\n                )\n        (out / f\"\
    {name}.json\").write_text(\n            json.dumps({\"argv\": command, \"exit_code\"\
    : result.returncode}, indent=2) + \"\\n\"\n        )\n        if result.returncode\
    \ != expected_exit:\n            raise ValueError(f\"{name}: exit {result.returncode},\
    \ expected {expected_exit}\")\n\n    candidates = json.loads(Path(inputs[\"candidate_files\"\
    ]).read_bytes())\n    if phase == \"external-candidate\":\n        run(\n    \
    \        \"apply-external-patch\",\n            [inputs[\"patch_tool\"], \"--batch\"\
    , \"-p1\", \"-i\", inputs[\"patch\"]],\n            0,\n        )\n        for\
    \ name, identity in candidates.items():\n            if digest(work / name) !=\
    \ identity[\"sha256\"]:\n                raise ValueError(f\"External candidate\
    \ differs: {name}\")\n    else:\n        # The regression is an external test\
    \ input; production source stays at the baseline.\n        test = \"score/socom/test/unit/service_identifier_tests.cpp\"\
    \n        payload = Path(inputs[\"candidate_root\"]) / test\n        if digest(payload)\
    \ != candidates[test][\"sha256\"]:\n            raise ValueError(\"External regression\
    \ test changed\")\n        shutil.copyfile(payload, work / test)\n\n    exe =\
    \ out / \"service-identifier-tests\"\n    run(\n        \"compile\",\n       \
    \ [\n            inputs[\"compiler\"],\n            \"-std=c++17\",\n        \
    \    \"-Wall\",\n            \"-Wextra\",\n            \"-Werror\",\n        \
    \    \"-pthread\",\n            \"-I.\",\n            f\"-I{gtest}/googletest/include\"\
    ,\n            f\"-I{gtest}/googletest\",\n            \"score/socom/impl/service_identifier.cpp\"\
    ,\n            \"score/socom/impl/string_registry.cpp\",\n            \"score/socom/test/unit/service_identifier_tests.cpp\"\
    ,\n            f\"{gtest}/googletest/src/gtest-all.cc\",\n            f\"{gtest}/googletest/src/gtest_main.cc\"\
    ,\n            \"-o\",\n            str(exe),\n        ],\n        0,\n    )\n\
    \    expected_exit, failures = (1, 7) if phase == \"baseline\" else (0, 0)\n \
    \   run(\"regression\", [str(exe), f\"--gtest_output=json:{out}/tests.json\"],\
    \ expected_exit)\n    result = json.loads((out / \"tests.json\").read_bytes())\n\
    \    if result[\"tests\"] != 13 or result[\"failures\"] != failures or result[\"\
    disabled\"] != 0:\n        raise ValueError(\"Unexpected native test counts\"\
    )\n    verify_tree(source, source_manifest)\n    verify_tree(gtest, gtest_manifest)\n\
    \    if digest(inputs_path) != expected:\n        raise ValueError(\"Measurement\
    \ inputs changed during execution\")\n    for item in inputs[\"controls\"]:\n\
    \        if digest(Path(item[\"path\"])) != item[\"sha256\"]:\n            raise\
    \ ValueError(f\"Control changed during execution: {item['path']}\")\n    record\
    \ = {\n        \"phase\": phase,\n        \"initiator\": \"Fabro native command\
    \ stage\",\n        \"inputs_sha256\": expected,\n        \"source_commit\": source_manifest[\"\
    commit\"],\n        \"compiler\": inputs[\"compiler\"],\n        \"exit_code\"\
    : expected_exit,\n        \"tests\": result[\"tests\"],\n        \"failures\"\
    : result[\"failures\"],\n        \"engineering_acceptance\": \"pending\",\n  \
    \      \"agent_implementation\": \"not_performed\",\n        \"outputs\": {p.name:\
    \ digest(p) for p in sorted(out.iterdir()) if p.is_file() and p != exe},\n   \
    \ }\n    (out / \"measurement.json\").write_text(json.dumps(record, indent=2)\
    \ + \"\\n\")\n    print(json.dumps(record, sort_keys=True), flush=True)\n\n\n\
    if __name__ == \"__main__\":\n    main()\n\nSCORE_MEASUREMENT_PY\n"
